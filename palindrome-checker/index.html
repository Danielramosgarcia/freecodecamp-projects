<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
    <title>Palindrome Checker</title>
</head>    
<body>
    <h2>É um Palindromo?</h2>
    <div class="card">    
        <label for="text-input" >Digite o texto para verificar se é um palíndromo:</label><input type="text" id="text-input">
        
        <button id="check-btn" type="button">Checar</button>
        <div id="result"></div>
    </div>
    <div class="card-explanation">
        <p id="explanation">💡<strong>Um Palíndromo</strong> é uma palavra ou frase que se escreve da mesma forma de trás para frente e de frente para trás, ignorando pontuação, maiúsculas e minúsculas e espaços.
        </p>
    </div>
</body>

</html>
